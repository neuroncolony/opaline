<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markets | Opaline</title>
<meta name="description" content="Browse 500+ tokenized stocks, ETFs, gold and treasuries. Filter by class, issuer and chain, sort live and trade any asset in one tap.">
<meta name="theme-color" content="#fbf8f4">
<meta property="og:title" content="Markets | Opaline">
<meta property="og:description" content="Browse 500+ tokenized stocks, ETFs, gold and treasuries. Filter by class, issuer and chain, sort live and trade any asset in one tap.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('opal:theme'))||(matchMedia('(prefers-color-scheme: dark)').matches?'dusk':'light')}catch(e){}</script>
<script src="/shell.js" defer></script>
</head>
<body>
<main>
<section class="wrap" style="padding-top:40px">
  <div class="page-head">
    <div>
      <span class="eyebrow rv">Live tokenized markets</span>
      <h1 class="title rv rv-1">Every asset, <em>one book</em></h1>
      <p class="lead rv rv-2">Stocks, ETFs, commodities, treasuries, private credit and pre-IPO wrappers, priced live across every chain we support.</p>
    </div>
    <div class="row wrapf rv rv-2" style="gap:10px">
      <div class="tabs" id="viewTabs">
        <button class="on" data-view="table">Table</button>
        <button data-view="grid">Grid</button>
      </div>
    </div>
  </div>

  <div class="card flat rv" style="padding:16px 18px">
    <div class="row wrapf" style="gap:12px">
      <div class="search" style="flex:1;min-width:220px" id="searchWrap"></div>
      <select class="input" id="issuerSel" style="max-width:210px"><option value="all">All issuers</option></select>
      <select class="input" id="chainSel" style="max-width:170px"><option value="all">All chains</option></select>
      <label class="row" style="gap:8px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap">
        <input type="checkbox" id="routable" style="width:17px;height:17px;accent-color:#7d67e8"> Routable only
      </label>
    </div>
    <div class="tabs" id="classTabs" style="margin-top:12px"></div>
  </div>

  <div class="grid g4" style="margin-top:18px" id="stats">
    <div class="card spot rv" style="padding:20px"><div class="stat"><div class="k">Assets shown</div><div class="v" id="sCount">-</div></div></div>
    <div class="card spot rv rv-1" style="padding:20px"><div class="stat"><div class="k">Total market cap</div><div class="v" id="sCap">-</div></div></div>
    <div class="card spot rv rv-2" style="padding:20px"><div class="stat"><div class="k">24h volume</div><div class="v" id="sVol">-</div></div></div>
    <div class="card spot rv rv-3" style="padding:20px"><div class="stat"><div class="k">Avg 24h change</div><div class="v" id="sAvg">-</div></div></div>
  </div>

  <div id="listWrap" style="margin-top:22px">
    <div class="tbl-wrap" id="tblWrap">
      <table class="tbl">
        <thead id="thead"><tr>
          <th style="width:36px"></th>
          <th data-k="symbol">Asset</th>
          <th data-k="class">Class</th>
          <th data-k="issuerName">Issuer</th>
          <th class="r" data-k="price">Price</th>
          <th class="r" data-k="ch1h">1h</th>
          <th class="r" data-k="ch24h">24h</th>
          <th class="r" data-k="ch7d">7d</th>
          <th class="r" data-k="mcap">Market cap</th>
          <th class="r" data-k="volume">Volume</th>
          <th>7d</th>
          <th class="r" data-k="_chains">Chains</th>
          <th></th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="13"><div class="skel" style="height:420px;background:none"></div></td></tr></tbody>
      </table>
    </div>
    <div class="grid g4" id="gridView" style="display:none"></div>
    <div style="text-align:center;margin-top:22px">
      <button class="btn btn-soft" id="loadMore" style="display:none">Load more</button>
    </div>
  </div>
</section>
</main>
<style>
#gridView .gcard img{width:42px;height:42px;border-radius:50%;background:var(--bg2)}
.gcard .gname{font-weight:800;font-size:15px;margin-top:10px}
.gcard .gsub{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td .tbtn{min-width:74px}
</style>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = O.$, $$ = O.$$;
  const qp = new URLSearchParams(location.search);
  const qpCls = qp.get('class');
  const state = { q: qp.get('q') || '', cls: O.CLASS[qpCls] && qpCls !== 'basket' ? qpCls : 'all',
                  issuer: 'all', chain: 'all', routable: false,
                  sort: { key: 'mcap', dir: -1 }, view: 'table', shown: 50 };
  let ALL = [], firstStats = true;

  $('#searchWrap').innerHTML = O.icon.search + '<input class="input" id="q" placeholder="Search assets, tickers, issuers" value="' + O.esc(state.q) + '">';
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim(); state.shown = 50; render(); });

  const tab = document.createElement('div');
  tab.className = 'tabs';
  tab.id = 'classTabs';
  const mkTabs = () => {
    const items = [['all', 'All']].concat(Object.keys(O.CLASS).filter(k => k !== 'basket').map(k => [k, O.CLASS[k].label]));
    tab.innerHTML = items.map(([k, l]) => `<button data-cls="${k}" class="${state.cls === k ? 'on' : ''}">${l}</button>`).join('');
  };
  mkTabs();
  $('#classTabs').replaceWith(tab);
  tab.addEventListener('click', e => { const b = e.target.closest('button[data-cls]'); if (!b) return; state.cls = b.dataset.cls; state.shown = 50; mkTabs(); render(); });

  $('#viewTabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]'); if (!b) return;
    state.view = b.dataset.view;
    $$('#viewTabs button').forEach(x => x.classList.toggle('on', x === b));
    $('#tblWrap').style.display = state.view === 'table' ? '' : 'none';
    $('#gridView').style.display = state.view === 'grid' ? '' : 'none';
    render();
  });

  function buildFilters() {
    const issuers = [...new Map(ALL.map(a => [a.issuer, a.issuerName])).entries()].sort((a, b) => String(a[1]).localeCompare(b[1]));
    const cur = state.issuer;
    $('#issuerSel').innerHTML = '<option value="all">All issuers</option>' +
      issuers.map(([slug, name]) => `<option value="${O.esc(slug)}">${O.esc(name)}</option>`).join('');
    $('#issuerSel').value = issuers.some(i => i[0] === cur) ? cur : 'all';
    const chains = [...new Set(ALL.flatMap(a => (a.chains || []).map(c => c.chainId)))].sort((a, b) => a - b);
    const curC = state.chain;
    $('#chainSel').innerHTML = '<option value="all">All chains</option>' +
      chains.map(c => `<option value="${c}">${O.esc(O.chainName(c))}</option>`).join('');
    $('#chainSel').value = chains.some(c => String(c) === curC) ? curC : 'all';
  }
  $('#issuerSel').addEventListener('change', e => { state.issuer = e.target.value; state.shown = 50; render(); });
  $('#chainSel').addEventListener('change', e => { state.chain = e.target.value; state.shown = 50; render(); });
  $('#routable').addEventListener('change', e => { state.routable = e.target.checked; state.shown = 50; render(); });

  function filtered() {
    const q = state.q.toLowerCase();
    const arr = ALL.filter(a => {
      if (state.cls !== 'all' && a.class !== state.cls) return false;
      if (state.issuer !== 'all' && a.issuer !== state.issuer) return false;
      if (state.chain !== 'all' && !(a.chains || []).some(c => String(c.chainId) === state.chain)) return false;
      if (state.routable && !(a.chains || []).length) return false;
      if (q && !((a.name || '') + ' ' + (a.symbol || '') + ' ' + (a.underlying || '')).toLowerCase().includes(q)) return false;
      return true;
    }).map(a => Object.assign({ _chains: (a.chains || []).length }, a));
    return O.sortBy(arr, state);
  }

  function renderStats(list) {
    const cnt = list.length;
    const cap = list.reduce((s, a) => s + (a.mcap || 0), 0);
    const vol = list.reduce((s, a) => s + (a.volume || 0), 0);
    const withCh = list.filter(a => a.ch24h != null);
    const avg = withCh.length ? withCh.reduce((s, a) => s + a.ch24h, 0) / withCh.length : 0;
    if (firstStats) {
      O.countUp($('#sCount'), cnt, v => O.num(v, 0));
      O.countUp($('#sCap'), cap, O.compact);
      O.countUp($('#sVol'), vol, O.compact);
      O.countUp($('#sAvg'), avg, v => O.pct(v));
      firstStats = false;
    } else {
      $('#sCount').textContent = O.num(cnt, 0);
      $('#sCap').textContent = O.compact(cap);
      $('#sVol').textContent = O.compact(vol);
      $('#sAvg').textContent = O.pct(avg);
      $('#sAvg').className = 'v ' + O.pctCls(avg);
    }
  }

  function rowHtml(a) {
    return `<tr data-id="${O.esc(a.id)}">
      <td>${O.starBtn(a.id)}</td>
      <td><span class="asset-cell">${O.img(a.image)}<span><b>${O.esc(a.symbol)}</b><small>${O.esc(a.name)}</small></span></span></td>
      <td>${O.classChip(a.class)}</td>
      <td><a href="/issuer/${O.esc(a.issuer)}" class="muted">${O.esc(a.issuerName || a.issuer)}</a></td>
      <td class="r mono">${O.usd(a.price)}</td>
      <td class="r mono ${O.pctCls(a.ch1h)}">${O.pct(a.ch1h)}</td>
      <td class="r mono ${O.pctCls(a.ch24h)}">${O.pct(a.ch24h)}</td>
      <td class="r mono ${O.pctCls(a.ch7d)}">${O.pct(a.ch7d)}</td>
      <td class="r mono">${O.compact(a.mcap)}</td>
      <td class="r mono">${O.compact(a.volume)}</td>
      <td>${O.spark(a.spark, 96, 30)}</td>
      <td class="r mono">${a._chains}</td>
      <td class="r"><button class="btn btn-sm btn-soft tbtn" data-buy="${O.esc(a.id)}">Trade</button></td>
    </tr>`;
  }

  function cardHtml(a, i) {
    return `<a class="card hover spot gcard tint-${(O.CLASS[a.class] || {}).tint || 'lav'}" href="/asset/${O.esc(a.id)}" style="padding:18px">
      <div class="row between"><span class="asset-cell">${O.img(a.image)}<span><b>${O.esc(a.symbol)}</b></span></span>${O.starBtn(a.id)}</div>
      <div class="gsub">${O.esc(a.name)}</div>
      <div class="row between" style="margin-top:10px"><span class="mono" style="font-size:16px">${O.usd(a.price)}</span>
      <span class="mono ${O.pctCls(a.ch24h)}">${O.pct(a.ch24h)}</span></div>
      <div style="margin-top:8px">${O.spark(a.spark, 240, 44)}</div>
      <div class="row between" style="margin-top:12px"><span class="faint" style="font-size:12px">${O.compact(a.mcap)} cap</span>
      <span class="row" style="gap:8px">${O.classChip(a.class)}<button class="btn btn-sm btn-soft" data-buy="${O.esc(a.id)}">Trade</button></span></div>
    </a>`;
  }

  function render() {
    if (!ALL.length) return;
    const list = filtered();
    renderStats(list);
    const page = list.slice(0, state.shown);
    if (state.view === 'table') {
      $('#tbody').innerHTML = page.length ? page.map(rowHtml).join('') :
        `<tr><td colspan="13"><div class="empty"><span class="serif">Nothing matches</span>Try clearing a filter or widening your search.</div></td></tr>`;
    } else {
      $('#gridView').innerHTML = page.length ? page.map(cardHtml).join('') :
        `<div class="card" style="grid-column:1/-1"><div class="empty"><span class="serif">Nothing matches</span>Try clearing a filter or widening your search.</div></div>`;
    }
    const lm = $('#loadMore');
    lm.style.display = list.length > state.shown ? '' : 'none';
    lm.textContent = `Load more (${list.length - state.shown} left)`;
    O.reveal();
  }

  $('#tbody').addEventListener('click', e => {
    if (e.target.closest('[data-buy]') || e.target.closest('[data-star]') || e.target.closest('a')) return;
    const tr = e.target.closest('tr[data-id]');
    if (tr) location.href = '/asset/' + tr.dataset.id;
  });
  $('#loadMore').addEventListener('click', () => { state.shown += 50; render(); });

  O.sortable($('#thead'), state, () => { state.shown = 50; render(); });

  async function refresh() {
    try {
      const j = await O.api('assets', { ttl: 0 });
      if (j.assets && j.assets.length) { ALL = j.assets; buildFilters(); render(); }
    } catch (e) { /* keep last good data */ }
  }

  try { ALL = await O.assets(); } catch (e) { ALL = []; }
  if (!ALL.length) {
    $('#listWrap').innerHTML = '<div class="card"><div class="empty"><span class="serif">Markets are waking up</span>Live prices did not load. Refresh in a moment to try again.</div></div>';
    $('#stats').style.display = 'none';
  } else {
    buildFilters(); render();
    setInterval(refresh, 60000);
  }
});
</script>
</body></html>
