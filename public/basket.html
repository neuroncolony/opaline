<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared basket | Opaline</title>
<meta name="description" content="A tokenized asset basket shared on Opaline. View it, copy it or buy it in one flow.">
<meta name="theme-color" content="#070a14">
<meta property="og:title" content="Shared basket | Opaline">
<meta property="og:description" content="A tokenized asset basket shared on Opaline. View it, copy it or buy it in one flow.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('opal:theme2'))||'dusk'}catch(e){}</script>
<script src="/shell.js" defer></script>
<script src="/basket-lib.js" defer></script>
</head>
<body>
<main><section class="wrap" id="root"><div class="skel" style="height:60px;max-width:480px"></div><div class="grid g2" style="margin-top:24px"><div class="skel" style="height:320px"></div><div class="skel" style="height:320px"></div></div></section></main>
<style>@media(max-width:900px){#bg{grid-template-columns:1fr!important}}</style>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const {esc, $} = O, id = location.pathname.split('/')[2] || '';
  let s; try { s = await O.api('share/' + encodeURIComponent(id), {ttl: 0}); } catch (e) { $('#root').innerHTML = `<div class="card empty" style="margin-top:40px"><span class="serif">This basket is not here</span>The link may be mistyped or expired.<div style="margin-top:18px"><a class="btn btn-primary" href="/baskets">Build your own</a></div></div>`; return; }
  const items = await OB.resolve(s.items);
  const w24 = OB.w24(items), w7 = OB.w7(items);
  $('#root').innerHTML = `<div class="page-head"><div><span class="eyebrow rv">Shared basket</span><h1 class="title rv rv-1">${esc(s.name)}</h1><p class="lead rv rv-2">${s.note ? esc(s.note) : `${items.length} assets, shared ${new Date(s.ts * 1000).toLocaleDateString()}`}${s.author ? ` by <span class="mono">${esc(O.short(s.author))}</span>` : ''} . ${s.views || 0} views</p></div><div class="row wrapf rv"><span class="chip ${w24 >= 0 ? 'mint' : 'rose'}">${O.pct(w24)} 24h</span><span class="chip ${w7 >= 0 ? 'mint' : 'rose'}">${O.pct(w7)} 7d</span></div></div>
  <div class="grid" id="bg" style="grid-template-columns:.8fr 1.2fr;gap:20px">
   <div class="col" style="gap:20px"><div class="card tint-lav rv"><div class="row" style="gap:20px">${OB.donut(items)}${OB.legend(items)}</div></div>
    <div class="card tint-mint rv rv-1"><label class="lbl">Budget (USD)</label><input class="input" id="budget" inputmode="decimal" value="100"><div class="grid g2" style="margin-top:12px;gap:8px"><button class="btn btn-grad" id="buy">Buy this basket</button><button class="btn btn-soft" id="copy">Copy to mine</button></div><button class="btn btn-ghost btn-block btn-sm" id="link" style="margin-top:8px">Copy link</button></div></div>
   <div class="col" style="gap:20px"><div class="card rv rv-1"><div class="row between"><h3>Last 7 days, simulated</h3><span class="chip" id="ret"></span></div><div id="chart" style="margin-top:10px"></div></div>
    <div class="tbl-wrap rv rv-2"><table class="tbl" style="min-width:560px"><thead><tr><th>Asset</th><th class="r">Weight</th><th class="r">Price</th><th class="r">24h</th><th class="r">7d</th><th></th></tr></thead><tbody>${items.map(i => `<tr onclick="location.href='/asset/${i.asset.id}'"><td><div class="asset-cell">${O.img(i.asset.image)}<div><b>${esc(i.asset.symbol)}</b><small>${esc(i.asset.name)}</small></div></div></td><td class="r"><b>${i.w.toFixed(1)}%</b></td><td class="r mono">${O.usd(i.asset.price)}</td><td class="r ${O.pctCls(i.asset.ch24h)}">${O.pct(i.asset.ch24h)}</td><td class="r ${O.pctCls(i.asset.ch7d)}">${O.pct(i.asset.ch7d)}</td><td class="r"><button class="btn btn-soft btn-sm" data-buy="${i.asset.id}">Trade</button></td></tr>`).join('')}</tbody></table></div></div></div>`;
  const sm = OB.chart($('#chart'), items); if (sm) { $('#ret').textContent = O.pct(sm.ret); $('#ret').className = 'chip ' + (sm.ret >= 0 ? 'mint' : 'rose'); }
  $('#buy').onclick = () => OB.buyAll(items, parseFloat($('#budget').value), s.name);
  $('#copy').onclick = () => { const all = O.store.get('baskets', []); const bid = O.uid(); all.unshift({bid, name: s.name, items: items.map(i => ({id: i.id, w: i.w})), created: Date.now()}); O.store.set('baskets', all); location.href = '/baskets?edit=' + bid; };
  $('#link').onclick = () => { navigator.clipboard.writeText(location.href); O.toast('Link copied', 'ok'); };
  O.reveal();
});
</script>
</body></html>
