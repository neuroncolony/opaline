<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issuer spreads | Opaline</title>
<meta name="description" content="The same stock is tokenized by several issuers at different prices. Compare wrappers, spot the spread and buy the cheapest.">
<meta name="theme-color" content="#f6f5fb">
<meta property="og:title" content="Issuer spreads | Opaline">
<meta property="og:description" content="The same stock is tokenized by several issuers at different prices. Compare wrappers, spot the spread and buy the cheapest.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('opal:theme3'))||'light'}catch(e){}</script>
<script src="/shell.js" defer></script>
</head>
<body>
<main>
<section class="wrap" style="padding-top:40px">
  <div class="page-head">
    <div>
      <span class="eyebrow rv">One underlying, many wrappers</span>
      <h1 class="title rv rv-1">Issuer <em>spreads</em></h1>
      <p class="lead rv rv-2">Several issuers tokenize the same share, and their prices drift apart. Here is every gap in the market, widest first, so you never overpay for a wrapper.</p>
    </div>
  </div>

  <div class="card flat rv" style="padding:16px 18px">
    <div class="row wrapf" style="gap:12px">
      <div class="search" style="flex:1;min-width:220px" id="searchWrap"></div>
      <div class="tabs" id="sortTabs">
        <button class="on" data-s="spread">Widest spread</button>
        <button data-s="count">Most issuers</button>
        <button data-s="volume">Most volume</button>
      </div>
    </div>
  </div>

  <div class="grid g3" style="margin-top:18px" id="top">
    <div class="card spot rv" style="padding:20px"><div class="stat"><div class="k">Groups compared</div><div class="v" id="tGroups">-</div></div></div>
    <div class="card spot rv rv-1" style="padding:20px"><div class="stat"><div class="k">Average spread</div><div class="v" id="tAvg">-</div></div></div>
    <div class="card spot rv rv-2" style="padding:20px"><div class="stat"><div class="k">Widest spread</div><div class="v" id="tWide">-</div></div></div>
  </div>

  <div style="margin-top:26px" id="list"><div class="skel" style="height:200px"></div></div>
  <div style="margin-top:40px" id="outliersWrap"></div>
</section>
</main>
<style>
.spread-bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:14px}
.spread-bar i{display:block;height:100%;border-radius:999px;background:var(--grad)}
.issue-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.issue-row:last-child{border-bottom:0}
.issue-row img{width:32px;height:32px;border-radius:50%;background:var(--bg2)}
</style>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = O.$, esc = O.esc, $$ = O.$$;
  const state = { q: '', sort: 'spread' };
  let groups = [], outliers = [];

  $('#searchWrap').innerHTML = O.icon.search + '<input class="input" id="q" placeholder="Search by ticker, e.g. NVDA">';

  function build(as) {
    const byU = new Map();
    as.forEach(a => {
      if ((a.class !== 'stock' && a.class !== 'etf') || !a.underlying || a.price == null) return;
      if (!byU.has(a.underlying)) byU.set(a.underlying, []);
      byU.get(a.underlying).push(a);
    });
    groups = []; outliers = [];
    byU.forEach((list, u) => {
      const clean = list.filter(x => x.price != null);
      if (clean.length < 2) return;
      const prices = clean.map(x => x.price);
      const min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
      if (min <= 0) return;
      const spread = (max - min) / min * 100;
      const vol = clean.reduce((s, x) => s + (x.volume || 0), 0);
      const sorted = clean.slice().sort((a, b) => a.price - b.price);
      const mid = sorted.length % 2 ? sorted[(sorted.length - 1) / 2].price : (sorted[sorted.length / 2 - 1].price + sorted[sorted.length / 2].price) / 2;
      const deepest = clean.slice().sort((a, b) => (b.volume || 0) - (a.volume || 0))[0];
      const g = { u, list: clean, min, max, spread, vol, mid, deepest, chains: [...new Set(clean.flatMap(x => (x.chains || []).map(c => c.chainId)))] };
      if (spread > 50) outliers.push(g); else groups.push(g);
    });
    groups.sort((a, b) => b.spread - a.spread);
    outliers.sort((a, b) => b.spread - a.spread);
  }

  function spreadBadge(s) {
    const hot = s > 5 ? 'rose' : s > 2 ? 'peach' : 'mint';
    return `<span class="chip ${hot}" style="font-size:14px;padding:6px 14px">${O.pct(s)}</span>`;
  }

  function groupCard(g, i) {
    const ivs = g.list.slice().sort((a, b) => a.price - b.price);
    const rows = ivs.map((x, j) => {
      const prem = (x.price - g.mid) / g.mid * 100;
      return `<div class="issue-row">
        ${O.img(x.image)}
        <span style="flex:1;min-width:150px"><b>${esc(x.symbol)}</b> <span class="faint" style="font-size:12px">${esc(x.issuerName || x.issuer)}</span>${x.price <= g.min + 1e-9 ? ' <span class="chip mint" style="font-size:10px">cheapest</span>' : ''}</span>
        <span class="mono" style="width:90px;text-align:right">${O.usd(x.price)}</span>
        <span class="mono ${O.pctCls(prem)}" style="width:86px;text-align:right">${O.pct(prem)} <span class="faint" style="font-size:11px">vs median</span></span>
        <span class="mono faint" style="width:80px;text-align:right">${O.compact(x.volume)}</span>
        <span class="faint" style="width:86px;text-align:right;font-size:12px">${(x.chains || []).length} chain${(x.chains || []).length === 1 ? '' : 's'}</span>
        <button class="btn btn-sm btn-soft" data-buy="${esc(x.id)}">Trade</button>
      </div>`;
    }).join('');
    return `<div class="card hover spot rv rv-${i % 4}" style="padding:24px" data-g="${esc(g.u)}">
      <div class="row between wrapf">
        <div class="row" style="gap:14px">
          ${O.img(ivs[0].image)}
          <div><div class="serif" style="font-size:30px;line-height:1">${esc(g.u)}</div>
          <div class="faint" style="font-size:13px">${g.list.length} issuers, ${g.chains.length} chains</div></div>
        </div>
        ${spreadBadge(g.spread)}
      </div>
      <div class="grid g3" style="margin-top:18px;gap:12px">
        <div><div class="stat"><div class="k">Cheapest</div><div class="v" style="font-size:24px">${O.usd(g.min)}</div><div class="s">${esc((ivs[0].issuerName || ivs[0].issuer))}</div></div></div>
        <div><div class="stat"><div class="k">Priciest</div><div class="v" style="font-size:24px">${O.usd(g.max)}</div><div class="s">${esc((ivs[ivs.length - 1].issuerName || ivs[ivs.length - 1].issuer))}</div></div></div>
        <div><div class="stat"><div class="k">Deepest book</div><div class="v" style="font-size:24px">${O.compact(g.deepest.volume)}</div><div class="s">${esc(g.deepest.issuerName || g.deepest.issuer)} by 24h volume</div></div></div>
      </div>
      <div class="spread-bar"><i style="width:${Math.min(100, g.spread * 4)}%"></i></div>
      <div style="margin-top:16px;display:none" data-rows>${rows}</div>
      <button class="btn btn-sm btn-ghost" data-exp style="margin-top:14px">Show all ${g.list.length} issuers ${O.icon.down}</button>
    </div>`;
  }

  function render() {
    const q = state.q.toLowerCase();
    const list = groups.filter(g => !q || g.u.toLowerCase().includes(q));
    const sorters = {
      spread: (a, b) => b.spread - a.spread,
      count: (a, b) => b.list.length - a.list.length || b.spread - a.spread,
      volume: (a, b) => b.vol - a.vol
    };
    const sorted = list.slice().sort(sorters[state.sort]);
    if (!groups.length) {
      $('#list').innerHTML = '<div class="card"><div class="empty"><span class="serif">No spreads to show</span>No underlying has two live wrappers right now. Check back after the next data refresh.</div></div>';
      $('#top').style.display = 'none';
      $('#outliersWrap').innerHTML = '';
      return;
    }
    $('#top').style.display = '';
    $('#tGroups').textContent = O.num(groups.length, 0);
    $('#tAvg').textContent = O.pct(groups.reduce((s, g) => s + g.spread, 0) / groups.length);
    $('#tWide').textContent = groups[0].u;
    $('#list').innerHTML = sorted.length ? sorted.map(groupCard).join('') :
      '<div class="card"><div class="empty"><span class="serif">No match</span>No underlying ticker starts with that. Try NVDA, AAPL or MSTR.</div></div>';
    $('#outliersWrap').innerHTML = outliers.length ? `
      <div class="page-head"><div><span class="eyebrow rv">Large gaps</span><h2 class="h2 rv rv-1">Check before <em>trading</em></h2></div></div>
      <p class="muted" style="margin-top:-14px;margin-bottom:18px">These spreads sit above 50%. That usually means a stale price, a paused mint or a wrapper trading far from its underlying, so they are listed separately. Verify the quote before you trade.</p>
      ${outliers.map(groupCard).join('')}` : '';
    O.reveal();
  }

  document.body.addEventListener('click', e => {
    const exp = e.target.closest('[data-exp]');
    if (exp) {
      const card = exp.closest('[data-g]');
      const rows = card.querySelector('[data-rows]');
      const open = rows.style.display !== 'none';
      rows.style.display = open ? 'none' : '';
      exp.innerHTML = open ? `Show all issuers ${O.icon.down}` : `Hide issuers ${O.icon.x}`;
    }
  });

  $('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
  $('#sortTabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-s]'); if (!b) return;
    state.sort = b.dataset.s;
    $$('#sortTabs button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });

  try {
    const as = await O.assets();
    build(as);
    render();
  } catch (e) {
    $('#list').innerHTML = '<div class="card"><div class="empty"><span class="serif">Data did not load</span>The market snapshot is unavailable right now. Refresh in a moment.</div></div>';
    $('#top').style.display = 'none';
  }
});
</script>
</body></html>
