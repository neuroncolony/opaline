<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchlist | Opaline</title>
<meta name="description" content="Your saved tokenized assets in one calm view: live prices, 7 day sparks and one tap trading.">
<meta name="theme-color" content="#fbf8f4">
<meta property="og:title" content="Watchlist | Opaline">
<meta property="og:description" content="Your saved tokenized assets in one calm view: live prices, 7 day sparks and one tap trading.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('opal:theme'))||(matchMedia('(prefers-color-scheme: dark)').matches?'dusk':'light')}catch(e){}</script>
<script src="/shell.js" defer></script>
</head>
<body>
<main>
<section class="wrap" style="padding-top:40px">
  <div class="page-head">
    <div>
      <span class="eyebrow rv">Your shortlist</span>
      <h1 class="title rv rv-1">The <em>watchlist</em></h1>
      <p class="lead rv rv-2">Stars from anywhere on Opaline land here, priced live. Star an asset and this page updates itself instantly.</p>
    </div>
    <div class="stat rv rv-2"><div class="k">Assets watched</div><div class="v" id="wCount">0</div></div>
  </div>

  <div id="mine" style="margin-top:6px"><div class="skel" style="height:200px"></div></div>

  <div style="margin-top:56px" id="sugSec">
    <div class="page-head">
      <div><span class="eyebrow rv">Ideas for the list</span><h2 class="h2 rv rv-1">Suggested, by <em>volume</em></h2></div>
      <a class="btn btn-soft" href="/markets">Browse markets</a>
    </div>
    <div class="grid g3" id="suggested"><div class="skel" style="height:160px"></div><div class="skel" style="height:160px"></div><div class="skel" style="height:160px"></div></div>
  </div>
</section>
</main>
<style>
.wcard{padding:20px}
.wcard .asset-cell img{width:40px;height:40px}
</style>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = O.$, esc = O.esc, $$ = O.$$;
  let MAP = {};

  function cardHtml(a) {
    return `<div class="card hover spot wcard rv" data-card="${esc(a.id)}">
      <div class="row between">
        <a class="asset-cell" href="/asset/${esc(a.id)}">${O.img(a.image)}<span><b>${esc(a.symbol)}</b><small>${esc(a.name)}</small></span></a>
        ${O.starBtn(a.id)}
      </div>
      <div class="row between" style="margin-top:12px">
        <span class="mono" style="font-size:20px">${O.usd(a.price)}</span>
        <span class="mono ${O.pctCls(a.ch24h)}">${O.pct(a.ch24h)}</span>
      </div>
      <div style="margin-top:8px">${O.spark(a.spark, 260, 40)}</div>
      <div class="row between" style="margin-top:14px">
        ${O.classChip(a.class)}
        <button class="btn btn-sm btn-grad" data-buy="${esc(a.id)}">Trade</button>
      </div>
    </div>`;
  }

  function render() {
    const ids = O.watch.list();
    const list = ids.map(i => MAP[i]).filter(Boolean);
    $('#wCount').textContent = O.num(list.length, 0);
    if (!list.length) {
      $('#mine').innerHTML = `<div class="card"><div class="empty">
        <span class="serif">Nothing starred yet</span>
        Tap the star on any market page and it will wait for you here.<br><br>
        <a class="btn btn-grad" href="/markets">Find assets to watch</a>
      </div></div>`;
    } else {
      $('#mine').innerHTML = `<div class="grid g3">${list.map(cardHtml).join('')}</div>`;
    }
    const sug = Object.values(MAP).filter(a => a.price != null && !O.watch.has(a.id))
      .sort((a, b) => (b.volume || 0) - (a.volume || 0)).slice(0, 6);
    $('#suggested').innerHTML = sug.length ? sug.map(a => `
      <div class="card hover spot wcard rv" data-card="${esc(a.id)}">
        <div class="row between">
          <a class="asset-cell" href="/asset/${esc(a.id)}">${O.img(a.image)}<span><b>${esc(a.symbol)}</b><small>${esc(a.name)}</small></span></a>
          <button class="btn btn-sm btn-soft" data-star-add="${esc(a.id)}">Star</button>
        </div>
        <div class="row between" style="margin-top:10px">
          <span class="mono">${O.usd(a.price)}</span>
          <span class="mono ${O.pctCls(a.ch24h)}">${O.pct(a.ch24h)}</span>
        </div>
        <div class="row between" style="margin-top:12px">
          <span class="faint" style="font-size:12px">${O.compact(a.volume)} vol</span>
          <button class="btn btn-sm btn-soft" data-buy="${esc(a.id)}">Trade</button>
        </div>
      </div>`).join('') : '<div class="card" style="grid-column:1/-1"><div class="empty"><span class="serif">All caught up</span>You are watching the busiest assets already. Markets has the rest.</div></div>';
    $$('#suggested [data-star-add]').forEach(b => b.onclick = () => O.watch.toggle(b.dataset.starAdd));
    O.reveal();
  }

  try {
    MAP = await O.assetMap();
    render();
  } catch (e) {
    $('#mine').innerHTML = '<div class="card"><div class="empty"><span class="serif">Prices did not load</span>We could not reach the market snapshot. Refresh in a moment and your list will render with live prices.</div></div>';
    $('#suggested').innerHTML = '';
  }
  window.addEventListener('opal:store', e => { if (e.detail === 'watch') render(); });
});
</script>
</body></html>
